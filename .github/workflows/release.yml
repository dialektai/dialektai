name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  # ── 1. Sanity tests before shipping ──────────────────────────────────────

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - name: Install Python deps
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: |
          cd python && source venv/bin/activate
          python -m playwright install chromium --with-deps
      - name: Run pytest
        run: |
          cd python && source venv/bin/activate
          # Integration tests require live PG/MySQL/CH DBs — run locally or
          # in separate workflow with docker services. Unit tests gate CI here.
          pytest -q --tb=short --ignore=tests/integration

  # ── 2. Linux build (.deb + .AppImage) ────────────────────────────────────
  # ubuntu-22.04 runner has GLIBC 2.35 — matching our support baseline.

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      # Separate wheel cache — setup-python's built-in cache only covers pip's
      # download cache. We additionally cache compiled wheels (~/.cache/pip/wheels)
      # so heavy C-extension deps (tokenizers, tiktoken etc.) don't rebuild from
      # source on every run.
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: pip-wheels-${{ runner.os }}-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-${{ runner.os }}-py3.12-

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps (GTK + WebKit + appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            file

      - name: Build Python sidecar (native on 22.04 — GLIBC 2.35 baseline)
        timeout-minutes: 15
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip wheel
          # Prefer pre-built wheels to avoid compiling C-extensions on the
          # runner (the previous v0.9.0 run got stuck >90 min here, almost
          # certainly on a heavy transitive like tokenizers/tiktoken building
          # from source). Two-pass install: first --only-binary=:all: so we
          # fail fast if a wheel is missing; if that fails (pure-python sdists
          # are fine to build), fall back to --prefer-binary.
          pip install --prefer-binary --only-binary=:all: -r requirements.txt pyinstaller \
              || pip install --prefer-binary -r requirements.txt pyinstaller
          # Skip smoke test inside the sandbox — Ollama isn't present in CI,
          # and the sidecar's lifespan retries Ollama on startup which can
          # hang the runner indefinitely. Binary presence is verified below.
          DIALEKT_BUILD_MODE=native DIALEKT_SKIP_SMOKE=1 bash build_sidecar.sh
          # The script's copy step runs regardless of smoke; verify output:
          TRIPLE="x86_64-unknown-linux-gnu"
          test -f "../frontend/src-tauri/binaries/dialekt-server-$TRIPLE"
          file "../frontend/src-tauri/binaries/dialekt-server-$TRIPLE"

      - name: Build Tauri bundles (.deb + .AppImage)
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles deb appimage

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oP '"version":\s*"\K[0-9.]+' frontend/src-tauri/tauri.conf.json)"
          mkdir -p release
          cp frontend/src-tauri/target/release/bundle/deb/*.deb      "release/dialekt_${VERSION}_amd64.deb"
          cp frontend/src-tauri/target/release/bundle/appimage/*.AppImage "release/dialekt_${VERSION}_amd64.AppImage"
          cd release
          for f in *.deb *.AppImage; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release/*
          if-no-files-found: error

  # ── 2b. Linux ARM64 build (.deb + .AppImage) ─────────────────────────────
  # ubuntu-22.04-arm runner — same GLIBC 2.35 baseline, native aarch64.

  build-linux-arm64:
    needs: test
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: pip-wheels-linux-arm64-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-linux-arm64-py3.12-

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps (GTK + WebKit + appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            file

      - name: Build Python sidecar (native aarch64)
        timeout-minutes: 25
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip wheel
          # Allow sdist fallback on ARM64 — fewer prebuilt wheels available
          # for some heavy C-extensions on linux-aarch64 vs x86_64.
          pip install --prefer-binary -r requirements.txt pyinstaller
          DIALEKT_BUILD_MODE=native DIALEKT_SKIP_SMOKE=1 bash build_sidecar.sh
          TRIPLE="aarch64-unknown-linux-gnu"
          test -f "../frontend/src-tauri/binaries/dialekt-server-$TRIPLE"
          file "../frontend/src-tauri/binaries/dialekt-server-$TRIPLE"

      - name: Build Tauri bundles (.deb + .AppImage, arm64)
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles deb appimage

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oP '"version":\s*"\K[0-9.]+' frontend/src-tauri/tauri.conf.json)"
          mkdir -p release
          cp frontend/src-tauri/target/release/bundle/deb/*.deb      "release/dialekt_${VERSION}_arm64.deb"
          cp frontend/src-tauri/target/release/bundle/appimage/*.AppImage "release/dialekt_${VERSION}_arm64.AppImage"
          cd release
          for f in *.deb *.AppImage; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: release/*
          if-no-files-found: error

  # ── 3. macOS build (.dmg + .app) ─────────────────────────────────────────
  # macos-latest is Apple Silicon by default on GitHub Actions runners.
  # Signed with Developer ID + notarized via Apple notarytool.

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip/wheels
          key: pip-wheels-macos-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-macos-py3.12-

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify the identity is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build Python sidecar (native, Apple Silicon)
        timeout-minutes: 25
        run: |
          set -x
          cd python
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip wheel
          python -m pip install --prefer-binary -r requirements.txt pyinstaller
          echo "::group::pyinstaller"
          pyinstaller --clean --log-level=WARN dialekt_server.spec
          echo "::endgroup::"
          test -f dist/dialekt-server
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server \
            ../frontend/src-tauri/binaries/dialekt-server-aarch64-apple-darwin
          chmod +x ../frontend/src-tauri/binaries/dialekt-server-aarch64-apple-darwin
          file ../frontend/src-tauri/binaries/dialekt-server-aarch64-apple-darwin

      - name: Sign sidecar with hardened runtime
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          SIDECAR="frontend/src-tauri/binaries/dialekt-server-aarch64-apple-darwin"
          codesign --force --options runtime \
            --entitlements frontend/src-tauri/Entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$SIDECAR"
          codesign -dv --verbose=4 "$SIDECAR"

      - name: Build Tauri bundles (.dmg + .app)
        env:
          # Certificate is already in keychain from the import step above.
          # Do NOT pass APPLE_CERTIFICATE here — Tauri would create its own
          # keychain and pick the wrong identity from a multi-cert .p12.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles dmg app --target aarch64-apple-darwin

      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$(ls frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          echo "Submitting $DMG_PATH for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          echo "Notarization complete — stapled to $DMG_PATH"

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oE '"version":[[:space:]]*"[0-9.]+"' frontend/src-tauri/tauri.conf.json | head -1 | grep -oE '[0-9.]+')"
          mkdir -p release
          cp frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            "release/dialekt_${VERSION}_aarch64.dmg"
          cd frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          APP_NAME="$(ls | grep '\.app$' | head -1)"
          zip -rqy "$GITHUB_WORKSPACE/release/dialekt_${VERSION}_aarch64.app.zip" "$APP_NAME"
          cd -
          cd release
          for f in *.dmg *.app.zip; do
            shasum -a 256 "$f" > "${f}.sha256"
          done
          ls -la

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: release/*
          if-no-files-found: error

  # ── 3b. macOS Intel build (.dmg + .app) ──────────────────────────────────
  # macos-13 runner is the last Intel-based GitHub-hosted macOS image. Needed
  # for users on pre-Apple-Silicon Macs (2019 MBP, 2018 Mac mini, etc.).
  # Signed with Developer ID + notarized. Marked continue-on-error: macos-13
  # runner allocation is unreliable on weekends.

  build-macos-intel:
    needs: test
    runs-on: macos-13
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip/wheels
          key: pip-wheels-macos-intel-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-macos-intel-py3.12-

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build Python sidecar (native, Intel x86_64)
        timeout-minutes: 25
        run: |
          set -x
          cd python
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip wheel
          python -m pip install --prefer-binary -r requirements.txt pyinstaller
          echo "::group::pyinstaller"
          pyinstaller --clean --log-level=WARN dialekt_server.spec
          echo "::endgroup::"
          test -f dist/dialekt-server
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server \
            ../frontend/src-tauri/binaries/dialekt-server-x86_64-apple-darwin
          chmod +x ../frontend/src-tauri/binaries/dialekt-server-x86_64-apple-darwin
          file ../frontend/src-tauri/binaries/dialekt-server-x86_64-apple-darwin

      - name: Sign sidecar with hardened runtime
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          SIDECAR="frontend/src-tauri/binaries/dialekt-server-x86_64-apple-darwin"
          codesign --force --options runtime \
            --entitlements frontend/src-tauri/Entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$SIDECAR"
          codesign -dv --verbose=4 "$SIDECAR"

      - name: Build Tauri bundles (.dmg + .app, Intel)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles dmg app --target x86_64-apple-darwin

      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$(ls frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          echo "Submitting $DMG_PATH for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          echo "Notarization complete — stapled to $DMG_PATH"

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oE '"version":[[:space:]]*"[0-9.]+"' frontend/src-tauri/tauri.conf.json | head -1 | grep -oE '[0-9.]+')"
          mkdir -p release
          cp frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            "release/dialekt_${VERSION}_x86_64.dmg"
          cd frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          APP_NAME="$(ls | grep '\.app$' | head -1)"
          zip -rqy "$GITHUB_WORKSPACE/release/dialekt_${VERSION}_x86_64.app.zip" "$APP_NAME"
          cd -
          cd release
          for f in *.dmg *.app.zip; do
            shasum -a 256 "$f" > "${f}.sha256"
          done
          ls -la

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifacts
          path: release/*
          if-no-files-found: error

  # ── 4. Windows build (.msi + NSIS .exe) ──────────────────────────────────
  # windows-latest runner. Code signing is skipped — users will see a
  # SmartScreen warning on first open. Add EV certificate signing later.

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pip/Cache/wheels
          key: pip-wheels-windows-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-windows-py3.12-

      # Windows venv layout differs from POSIX (Scripts/ not bin/), so we
      # can't call build_sidecar.sh directly — it hard-codes source venv/bin/
      # activate. Inline the PyInstaller call using the same flags.
      - name: Build Python sidecar (native, Windows x64)
        timeout-minutes: 25
        run: |
          cd python
          python -m venv venv
          source venv/Scripts/activate
          # On Windows, pip cannot replace its own pip.exe while running.
          # Use `python -m pip` so the upgrade runs through the Python
          # interpreter instead of pip.exe calling itself.
          python -m pip install --upgrade pip wheel
          # --prefer-binary without --only-binary=:all: — some deps don't
          # have a matching wheel, so we allow source build as needed.
          python -m pip install --prefer-binary -r requirements.txt pyinstaller
          pyinstaller --clean --log-level=WARN dialekt_server.spec
          test -f dist/dialekt-server.exe
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server.exe \
            ../frontend/src-tauri/binaries/dialekt-server-x86_64-pc-windows-msvc.exe

      - name: Build Tauri bundles (.msi + NSIS .exe)
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles msi nsis --target x86_64-pc-windows-msvc

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oE '"version":[[:space:]]*"[0-9.]+"' frontend/src-tauri/tauri.conf.json | head -1 | grep -oE '[0-9.]+')"
          mkdir -p release
          cp frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi \
            "release/dialekt_${VERSION}_x64.msi"
          cp frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe \
            "release/dialekt_${VERSION}_x64-setup.exe"
          cd release
          for f in *.msi *-setup.exe; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*
          if-no-files-found: error

  # ── 4b. Windows ARM64 build (.msi + NSIS .exe) ───────────────────────────
  # windows-11-arm runner. Marked continue-on-error: many Python C-extension
  # wheels (tokenizers, tiktoken, …) lack windows-arm64 prebuilts as of 2026,
  # forcing slow source builds that may fail. We still attempt every release;
  # a failure here doesn't block the rest of the matrix.

  build-windows-arm64:
    needs: test
    runs-on: windows-11-arm
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # MSVC C1083 ("Cannot open compiler generated file: '': Invalid argument")
      # fires when grpcio's upb-gen/envoy/.../http_connection_manager.upb_minitable.c
      # path exceeds MAX_PATH (260 chars). win-x64 dodges this with a prebuilt
      # wheel; win-arm64 has no wheel and must compile from source. Two-pronged
      # fix: registry opt-in for long paths + a short TMP/TEMP root so pip's
      # build dir starts at C:\T\... instead of ~\AppData\Local\Temp\....
      - name: Enable Windows long paths + short TEMP root
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          New-Item -ItemType Directory -Path "C:\T" -Force | Out-Null
          "TMP=C:\T"    | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=C:\T"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMPDIR=C:\T" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pip/Cache/wheels
          key: pip-wheels-windows-arm64-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-windows-arm64-py3.12-

      - name: Build Python sidecar (native, Windows ARM64)
        timeout-minutes: 40
        run: |
          cd python
          python -m venv venv
          source venv/Scripts/activate
          python -m pip install --upgrade pip wheel
          # No --only-binary fallback: many deps lack windows-arm64 wheels
          # and must build from source. Slower but more likely to complete.
          python -m pip install --prefer-binary -r requirements.txt pyinstaller
          pyinstaller --clean --log-level=WARN dialekt_server.spec
          test -f dist/dialekt-server.exe
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server.exe \
            ../frontend/src-tauri/binaries/dialekt-server-aarch64-pc-windows-msvc.exe

      - name: Build Tauri bundles (.msi + NSIS .exe, ARM64)
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles msi nsis --target aarch64-pc-windows-msvc

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oE '"version":[[:space:]]*"[0-9.]+"' frontend/src-tauri/tauri.conf.json | head -1 | grep -oE '[0-9.]+')"
          mkdir -p release
          cp frontend/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi \
            "release/dialekt_${VERSION}_arm64.msi"
          cp frontend/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe \
            "release/dialekt_${VERSION}_arm64-setup.exe"
          cd release
          for f in *.msi *-setup.exe; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-artifacts
          path: release/*
          if-no-files-found: error

  # ── 5. Publish release ───────────────────────────────────────────────────

  release:
    # Best-effort jobs (build-macos-intel, build-windows-arm64) deliberately
    # excluded from `needs:` — they have unreliable runner availability
    # (macos-13 queues for hours, windows-11-arm has wheel-build issues), and
    # `timeout-minutes` only counts running time, not queue time. So a job
    # stuck in queue would block release indefinitely. The matching
    # download-artifact steps in this job are `continue-on-error: true`,
    # so if either job *does* finish before this job runs, its artifacts
    # ride along; otherwise the release publishes without them.
    needs: [build-linux, build-linux-arm64, build-macos, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges | head -30)
          fi
          {
            echo "CHANGES<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-arm64-artifacts
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-intel-artifacts
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release

      - name: Download Windows ARM64 artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-arm64-artifacts
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dialekt ${{ github.ref_name }}
          body: |
            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.CHANGES }}

            ---

            ### Installation

            **Linux x86_64 — Ubuntu / Debian / Mint**:
            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dialekt_*_amd64.deb
            sudo dpkg -i dialekt_*_amd64.deb
            sudo apt-get install -f
            ```

            **Linux ARM64 — Raspberry Pi 5, ARM servers, Ampere**:
            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dialekt_*_arm64.deb
            sudo dpkg -i dialekt_*_arm64.deb
            sudo apt-get install -f
            ```

            **Linux — Fedora / Arch / openSUSE / any glibc 2.35+**:
            ```sh
            # x86_64
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dialekt_*_amd64.AppImage
            # ARM64
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dialekt_*_arm64.AppImage
            chmod +x dialekt_*.AppImage
            ./dialekt_*.AppImage
            ```

            **macOS — Apple Silicon (M1/M2/M3/M4)**:
            Download `dialekt_*_aarch64.dmg`, open, drag to Applications.

            **macOS — Intel (pre-2020 Macs)**:
            Download `dialekt_*_x86_64.dmg`, open, drag to Applications.

            The macOS build is signed with a Developer ID certificate and notarized
            by Apple — it should open without any Gatekeeper warnings.

            **Windows — x64**:
            Download `dialekt_*_x64-setup.exe` (NSIS installer) or `dialekt_*_x64.msi`.

            **Windows — ARM64 (Surface Pro X, Snapdragon X laptops)**:
            Download `dialekt_*_arm64-setup.exe` (NSIS installer) or `dialekt_*_arm64.msi`.

            On first open Windows SmartScreen will warn — click "More info" → "Run anyway".
            The build is not yet code-signed; EV certificate signing is on the roadmap.

            ---

            **Requirements**:
            - Linux: glibc 2.35+ (Ubuntu 22.04, Debian 12, Fedora 38+) — x86_64 or arm64
            - macOS: 12.0 (Monterey) or newer — Apple Silicon or Intel
            - Windows: Windows 10 or 11 — x64 or ARM64
            - Ollama 0.4+ running locally (https://ollama.com)
            - 16 GB RAM (48 GB recommended for 32B models)

            **Verify downloads**:
            ```sh
            sha256sum -c dialekt_*.sha256     # Linux / Git Bash
            shasum -a 256 -c dialekt_*.sha256 # macOS
            ```
          files: |
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/*.app.zip
            release/*.msi
            release/*-setup.exe
            release/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 7. Append landing/changelog.html with the new release ────────────────
  # Auto-mirrors the GitHub Release into the public-facing dias.now/changelog
  # so the static site stays in sync. Runs after `release` so it never blocks
  # the binary-publishing path. Idempotent: skips if the version block is
  # already in changelog.html.

  update-changelog:
    name: Update landing/changelog.html
    needs: release
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run update_changelog.py
        run: |
          python3 scripts/update_changelog.py "${{ github.ref_name }}"
      - name: Commit and push (if changed)
        run: |
          if git diff --quiet landing/changelog.html; then
            echo "no changelog changes — version already present"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing/changelog.html
          git commit -m "docs(changelog): auto-add ${{ github.ref_name }} from release pipeline [skip ci]"
          git push origin main
