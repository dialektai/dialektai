name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  # ── 1. Sanity tests before shipping ──────────────────────────────────────

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - name: Install Python deps
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run pytest
        run: |
          cd python && source venv/bin/activate
          # Integration tests require live PG/MySQL/CH DBs — run locally or
          # in separate workflow with docker services. Unit tests gate CI here.
          pytest -q --tb=short --ignore=tests/integration

  # ── 2. Linux build (.deb + .AppImage) ────────────────────────────────────
  # ubuntu-22.04 runner has GLIBC 2.35 — matching our support baseline.

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      # Separate wheel cache — setup-python's built-in cache only covers pip's
      # download cache. We additionally cache compiled wheels (~/.cache/pip/wheels)
      # so heavy C-extension deps (tokenizers, tiktoken etc.) don't rebuild from
      # source on every run.
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: pip-wheels-${{ runner.os }}-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-${{ runner.os }}-py3.12-

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps (GTK + WebKit + appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            file

      - name: Build Python sidecar (native on 22.04 — GLIBC 2.35 baseline)
        timeout-minutes: 15
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip wheel
          # Prefer pre-built wheels to avoid compiling C-extensions on the
          # runner (the previous v0.9.0 run got stuck >90 min here, almost
          # certainly on a heavy transitive like tokenizers/tiktoken building
          # from source). Two-pass install: first --only-binary=:all: so we
          # fail fast if a wheel is missing; if that fails (pure-python sdists
          # are fine to build), fall back to --prefer-binary.
          pip install --prefer-binary --only-binary=:all: -r requirements.txt pyinstaller \
              || pip install --prefer-binary -r requirements.txt pyinstaller
          # Skip smoke test inside the sandbox — Ollama isn't present in CI,
          # and the sidecar's lifespan retries Ollama on startup which can
          # hang the runner indefinitely. Binary presence is verified below.
          DIALEKT_BUILD_MODE=native DIALEKT_SKIP_SMOKE=1 bash build_sidecar.sh
          # The script's copy step runs regardless of smoke; verify output:
          TRIPLE="x86_64-unknown-linux-gnu"
          test -f "../frontend/src-tauri/binaries/dialekt-server-$TRIPLE"
          file "../frontend/src-tauri/binaries/dialekt-server-$TRIPLE"

      - name: Build Tauri bundles (.deb + .AppImage)
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles deb appimage

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oP '"version":\s*"\K[0-9.]+' frontend/src-tauri/tauri.conf.json)"
          mkdir -p release
          cp frontend/src-tauri/target/release/bundle/deb/*.deb      "release/dialekt_${VERSION}_amd64.deb"
          cp frontend/src-tauri/target/release/bundle/appimage/*.AppImage "release/dialekt_${VERSION}_amd64.AppImage"
          cd release
          for f in *.deb *.AppImage; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release/*
          if-no-files-found: error

  # ── 3. macOS build (.dmg + .app) ─────────────────────────────────────────
  # macos-latest is Apple Silicon by default on GitHub Actions runners as of
  # 2024+. Code signing is skipped — users will see a Gatekeeper "unidentified
  # developer" warning on first open. Add Developer ID signing + notarization
  # in a later milestone.

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip/wheels
          key: pip-wheels-macos-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-macos-py3.12-

      # Inline PyInstaller invocation (same shape as build-windows). Previous
      # rc2 attempt called `bash build_sidecar.sh` which silently exited 1
      # on macOS runners right after pip's "Successfully installed" message
      # — cause was the script's inner `pip install --quiet --upgrade pip`
      # interacting poorly with the runner's cached venv. Inlining bypasses
      # it entirely and matches what build-windows already does successfully.
      - name: Build Python sidecar (native, Apple Silicon)
        timeout-minutes: 25
        run: |
          set -x
          cd python
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip wheel
          python -m pip install --prefer-binary -r requirements.txt pyinstaller
          echo "::group::pyinstaller"
          pyinstaller --clean --log-level=WARN dialekt_server.spec
          echo "::endgroup::"
          test -f dist/dialekt-server
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server \
            ../frontend/src-tauri/binaries/dialekt-server-aarch64-apple-darwin
          chmod +x ../frontend/src-tauri/binaries/dialekt-server-aarch64-apple-darwin
          file ../frontend/src-tauri/binaries/dialekt-server-aarch64-apple-darwin

      - name: Build Tauri bundles (.dmg + .app)
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles dmg app --target aarch64-apple-darwin

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oE '"version":[[:space:]]*"[0-9.]+"' frontend/src-tauri/tauri.conf.json | head -1 | grep -oE '[0-9.]+')"
          mkdir -p release
          cp frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            "release/dialekt_${VERSION}_aarch64.dmg"
          # .app is a directory — zip it for artifact upload. Use an
          # absolute path via $GITHUB_WORKSPACE instead of relative
          # ../ traversal (previous `../../../../../../release/...`
          # undercounted by one level — it landed at frontend/release/
          # which doesn't exist, breaking v0.11.0 on the first real
          # release run).
          cd frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          APP_NAME="$(ls | grep '\.app$' | head -1)"
          zip -rqy "$GITHUB_WORKSPACE/release/dialekt_${VERSION}_aarch64.app.zip" "$APP_NAME"
          cd -
          cd release
          for f in *.dmg *.app.zip; do
            shasum -a 256 "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: release/*
          if-no-files-found: error

  # ── 4. Windows build (.msi + NSIS .exe) ──────────────────────────────────
  # windows-latest runner. Code signing is skipped — users will see a
  # SmartScreen warning on first open. Add EV certificate signing later.

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pip/Cache/wheels
          key: pip-wheels-windows-py3.12-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-wheels-windows-py3.12-

      # Windows venv layout differs from POSIX (Scripts/ not bin/), so we
      # can't call build_sidecar.sh directly — it hard-codes source venv/bin/
      # activate. Inline the PyInstaller call using the same flags.
      - name: Build Python sidecar (native, Windows x64)
        timeout-minutes: 25
        run: |
          cd python
          python -m venv venv
          source venv/Scripts/activate
          # On Windows, pip cannot replace its own pip.exe while running.
          # Use `python -m pip` so the upgrade runs through the Python
          # interpreter instead of pip.exe calling itself.
          python -m pip install --upgrade pip wheel
          # --prefer-binary without --only-binary=:all: — some deps don't
          # have a matching wheel, so we allow source build as needed.
          python -m pip install --prefer-binary -r requirements.txt pyinstaller
          pyinstaller --clean --log-level=WARN dialekt_server.spec
          test -f dist/dialekt-server.exe
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server.exe \
            ../frontend/src-tauri/binaries/dialekt-server-x86_64-pc-windows-msvc.exe

      - name: Build Tauri bundles (.msi + NSIS .exe)
        run: |
          cd frontend
          npm ci
          npm run tauri -- build --bundles msi nsis --target x86_64-pc-windows-msvc

      - name: Collect + hash artifacts
        run: |
          VERSION="$(grep -oE '"version":[[:space:]]*"[0-9.]+"' frontend/src-tauri/tauri.conf.json | head -1 | grep -oE '[0-9.]+')"
          mkdir -p release
          cp frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi \
            "release/dialekt_${VERSION}_x64.msi"
          cp frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe \
            "release/dialekt_${VERSION}_x64-setup.exe"
          cd release
          for f in *.msi *-setup.exe; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*
          if-no-files-found: error

  # ── 5. Publish release ───────────────────────────────────────────────────

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges | head -30)
          fi
          {
            echo "CHANGES<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dialekt ${{ github.ref_name }}
          body: |
            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.CHANGES }}

            ---

            ### Installation

            **Linux — Ubuntu / Debian / Mint**:
            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dialekt_*_amd64.deb
            sudo dpkg -i dialekt_*_amd64.deb
            sudo apt-get install -f
            ```

            **Linux — Fedora / Arch / openSUSE / any glibc 2.35+**:
            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dialekt_*_amd64.AppImage
            chmod +x dialekt_*.AppImage
            ./dialekt_*.AppImage
            ```

            **macOS — Apple Silicon (M1/M2/M3)**:
            Download `dialekt_*_aarch64.dmg`, open, drag to Applications.
            First open: **right-click the app in Applications → Open → Open** in
            the Gatekeeper prompt (build is ad-hoc signed, not notarized — an
            "unidentified developer" warning is expected on first launch only).
            If macOS still says the app is damaged, run once in Terminal:
            `xattr -cr /Applications/dialekt.app` — this removes the download
            quarantine flag. Developer ID signing + notarization is on the roadmap.

            **Windows — x64**:
            Download `dialekt_*_x64-setup.exe` (NSIS installer) or `dialekt_*_x64.msi`.
            First open: SmartScreen will warn — click "More info" → "Run anyway".
            The build is not yet code-signed; EV certificate signing is on the roadmap.

            ---

            **Requirements**:
            - Linux: glibc 2.35+ (Ubuntu 22.04, Debian 12, Fedora 38+)
            - macOS: 12.0 (Monterey) or newer, Apple Silicon only for now
            - Windows: Windows 10 or 11, x64
            - Ollama 0.4+ running locally (https://ollama.com)
            - 16 GB RAM (48 GB recommended for 32B models)

            **Verify downloads**:
            ```sh
            sha256sum -c dialekt_*.sha256     # Linux / Git Bash
            shasum -a 256 -c dialekt_*.sha256 # macOS
            ```
          files: |
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/*.app.zip
            release/*.msi
            release/*-setup.exe
            release/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
