name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

env:
  # Tauri updater signing key — set in GitHub repo secrets
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # ── Run backend tests before building ─────────────────────────────────────

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd python
          source venv/bin/activate
          python -m pytest -q --tb=short

  # ── Build macOS universal .dmg ─────────────────────────────────────────────

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust (universal target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Python deps + PyInstaller
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pyinstaller

      - name: Build Python sidecar (universal)
        run: |
          cd python && source venv/bin/activate

          # arm64
          pyinstaller dialekt_server.spec --distpath dist --target-arch arm64 --noconfirm -y 2>/dev/null
          mv dist/dialekt-server dist/dialekt-server-arm64

          # x86_64
          pyinstaller dialekt_server.spec --distpath dist --target-arch x86_64 --noconfirm -y 2>/dev/null
          mv dist/dialekt-server dist/dialekt-server-x86_64

          # universal binary
          lipo -create -output dist/dialekt-server dist/dialekt-server-arm64 dist/dialekt-server-x86_64
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server ../frontend/src-tauri/binaries/dialekt-server-universal-apple-darwin
          chmod +x ../frontend/src-tauri/binaries/dialekt-server-universal-apple-darwin

      - name: Import Apple Developer certificate (if secrets present)
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build Tauri app (macOS universal)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
        run: |
          cd frontend
          npm ci
          npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Build Linux .AppImage + .deb ──────────────────────────────────────────

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Python sidecar (Linux)
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pyinstaller
          pyinstaller dialekt_server.spec --distpath dist --noconfirm -y 2>/dev/null
          mkdir -p ../frontend/src-tauri/binaries
          TARGET=$(rustc -vV | grep ^host | cut -d' ' -f2)
          cp dist/dialekt-server ../frontend/src-tauri/binaries/dialekt-server-${TARGET}
          chmod +x ../frontend/src-tauri/binaries/dialekt-server-${TARGET}

      - name: Build Tauri app (Linux)
        run: |
          cd frontend
          npm ci
          npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ── Build Windows .msi ────────────────────────────────────────────────────

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Python sidecar (Windows)
        shell: bash
        run: |
          cd python
          python -m venv venv
          source venv/Scripts/activate
          pip install -r requirements.txt pyinstaller
          pyinstaller dialekt_server.spec --distpath dist --noconfirm -y
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/dialekt-server.exe ../frontend/src-tauri/binaries/dialekt-server-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app (Windows)
        run: |
          cd frontend
          npm ci
          npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ── Create GitHub Release ─────────────────────────────────────────────────

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dialekt ${{ github.ref_name }}
          body: |
            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.CHANGES }}

            ---

            ### Installation

            **macOS** (Intel + Apple Silicon):
            Download `dialekt_*.dmg` → drag to Applications.

            > ⚠️ **Gatekeeper warning**: Until Apple Developer signing is active, run once:
            > ```sh
            > xattr -cr /Applications/dialekt.app
            > ```
            > Then open normally.

            **Linux**:
            - Ubuntu/Debian: `sudo dpkg -i dialekt_*.deb`
            - Other: run `dialekt_*.AppImage` directly (make executable first)

            **Windows**: Run the `.exe` installer.
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
