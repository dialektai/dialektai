spec_version: "1.0.1"
minimum_dialekt_version: "1.0.0"

metadata:
  id: "5f2c81d4-9b07-4f63-a8e1-6d4a2c83e9f5"
  name: "Мониторинг законодательства РК"
  description: "Каждую пятницу 18:00 ищет изменения в законодательстве РК за неделю и предлагает новые темы для тренингов IBA. Результат уходит в Telegram академическому отделу."
  version: "1.0.0"
  tags:
    - iba
    - legal
    - scheduled
    - research
    - russian
  language: ru
  author:
    name: "dias.now"
    email: "hello@dias.now"
  created_at: "2026-04-27T00:00:00+06:00"
  updated_at: "2026-04-27T00:00:00+06:00"

model:
  preferred: "gemma3:27b"
  acceptable:
    - "gemma3-12b"
    - "gemma3:12b"
  min_context_window: 16000
  requirements:
    min_ram_gb: 16
    min_vram_gb: 8
    recommended_ram_gb: 32
  parameters:
    temperature: 0.4
    top_p: 0.9
    max_tokens: 4096

system_prompt: |
  Ты — академический методолог International Business Academy (IBA).
  Раз в неделю отслеживаешь изменения в законодательстве РК которые
  актуальны для бизнес-обучения, и предлагаешь новые темы для
  тренингов и сертификационных программ.

  ОТВЕЧАЙ ТОЛЬКО НА РУССКОМ.

  ФОРМАТ ВЫХОДА:
  1. Краткое резюме (3-5 строк): какие изменения произошли за неделю.
     Указывай источник (закон, кодекс, постановление, дата принятия,
     дата вступления в силу).
  2. Список из 3-5 предложений по темам тренингов:
     - Название темы
     - Целевая аудитория (CFO / HR / комплаенс / юристы / общий менеджмент)
     - Длительность (1 день / 2 дня / 1 неделя)
     - Чем актуально именно сейчас (2-3 предложения)
     - Какие из существующих программ IBA можно дополнить вместо
       создания новой

  ОГРАНИЧЕНИЯ:
  - Если изменений за неделю нет — честно скажи "значимых изменений
    нет, ниже отложенные темы со списка ожидания". Не выдумывай.
  - Не цитируй полные тексты законов. Указывай номер и пункт, чтобы
    методолог мог проверить сам.
  - Учитывай только нормативные акты РК и решения KZ-регуляторов
    (Минфин, КГД, Нацбанк, АРРФР, Минтруда).

  ИСТОЧНИКИ ДЛЯ ПОИСКА (если есть веб-доступ):
  - adilet.zan.kz — главный реестр НПА
  - online.zakon.kz, paragraph.kz — обзоры
  - Telegram-каналы официальных регуляторов

capabilities:
  groups:
    - web_search
    - rss_read
  exceptions: []

secrets_required:
  - name: "telegram_chat_id"
    description: "ID чата куда слать дайджест НПА. Узнать: напиши боту /start и забери из @userinfobot."
    required: true
  - name: "telegram_bot_token"
    description: "Bot token (от @BotFather). Формат 123456:ABC-DEF..."
    required: true

autonomy:
  recommended: "review-only"
  max_allowed: "ask-before-write"

input:
  type: "chat"
  placeholder: ""

output:
  format: "markdown"
  streaming: false
  destination:
    type: "email_or_telegram"
    telegram_chat_id: "${secrets.telegram_chat_id}"
    telegram_bot_token: "${secrets.telegram_bot_token}"

trigger:
  type: "scheduled"
  schedule: "0 18 * * FRI"
  timezone: "Asia/Almaty"
  missed_run_policy: "run_on_startup"
  rss_feeds:
    # Официальный реестр НПА РК. Сценарий: scheduler diff'ит фид
    # против agent_rss_state на каждом тике; новые айтемы
    # вкладываются в prompt как Markdown-блок ПЕРЕД сообщением
    # ниже. Без этой строки агент бы сам искал "что новое" через
    # web_search и тратил такты на шум.
    - "https://adilet.zan.kz/rus/docs/rss"
  message: |
    Сегодня пятница. Выше — список НПА опубликованных за неделю
    (если их нет, разделом "RSS — new since last poll" будет пусто).
    Прочитай заголовки + краткие описания, выбери те что актуальны
    для бизнес-обучения, и предложи 3-5 новых тем для тренингов IBA
    с указанием целевой аудитории и почему это актуально именно
    сейчас. Если значимых изменений за неделю нет — скажи об этом
    прямо и предложи темы из отложенного списка.
