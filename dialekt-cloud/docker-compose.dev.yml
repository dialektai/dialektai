# Local test database — mirrors the CI cloud-tests job exactly.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   cd dialekt-cloud && python -m pytest tests/ -v
#   docker compose -f docker-compose.dev.yml down
#
# DATABASE_URL is the conftest.py default (no env var needed):
#   postgresql://dialekt_cloud:dialekt_cloud_pass@localhost:5433/dialekt_cloud_test

services:
  pg-test:
    image: postgres:16-alpine
    container_name: dialekt-test-db
    environment:
      POSTGRES_DB: dialekt_cloud_test
      POSTGRES_USER: dialekt_cloud
      POSTGRES_PASSWORD: dialekt_cloud_pass
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialekt_cloud -d dialekt_cloud_test"]
      interval: 3s
      timeout: 2s
      retries: 10
