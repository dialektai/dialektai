<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>dialekt.ai — Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', monospace; background: #0a0e14; color: #cdd6f4; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: #13181f; border: 1px solid #2a3244; padding: 48px; width: 100%; max-width: 400px; }
.logo { font-size: 16px; color: #89dceb; letter-spacing: .12em; margin-bottom: 32px; }
h1 { font-size: 18px; color: #cdd6f4; margin-bottom: 4px; }
p { font-size: 12px; color: #6c7086; margin-bottom: 32px; }
label { display: block; font-size: 11px; color: #6c7086; letter-spacing: .08em; margin-bottom: 6px; }
input { width: 100%; background: #0a0e14; border: 1px solid #2a3244; color: #cdd6f4; font-family: inherit; font-size: 13px; padding: 10px 12px; outline: none; }
input:focus { border-color: #89dceb; }
button { width: 100%; background: #89dceb; color: #0a0e14; border: none; font-family: inherit; font-size: 13px; font-weight: bold; letter-spacing: .06em; padding: 12px; cursor: pointer; margin-top: 16px; }
button:hover { background: #74c7ec; }
.error { background: #45142a; border: 1px solid #f38ba8; color: #f38ba8; padding: 10px 12px; font-size: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">dialekt.ai / ADMIN</div>
  <h1>Вход в панель управления</h1>
  <p>Только для основателя</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/admin/ui/login">
    <label>КЛЮЧ ДОСТУПА</label>
    <input type="password" name="admin_key" placeholder="Введите DIALEKT_ADMIN_KEY" autofocus required>
    <button type="submit">ВОЙТИ →</button>
  </form>
</div>
</body>
</html>
