<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>New trial signup</title>
<style>
  body { font-family: 'JetBrains Mono', monospace; background: #0a0e14; color: #cdd6f4; margin: 0; padding: 30px 20px; font-size: 13px; line-height: 1.65; }
  .card { max-width: 600px; margin: 0 auto; background: #13181f; border: 1px solid #2a3244; padding: 28px; }
  h1 { font-size: 16px; color: #00d4ff; letter-spacing: .12em; margin: 0 0 18px; }
  .row { display: flex; padding: 6px 0; border-bottom: 1px solid #2a3244; }
  .row:last-of-type { border-bottom: none; }
  .label { color: #64748b; min-width: 140px; letter-spacing: .08em; font-size: 11px; text-transform: uppercase; }
  .value { color: #cdd6f4; flex: 1; word-break: break-word; }
  .intent { background: #0a0e14; border-left: 2px solid #00d4ff; padding: 14px 16px; margin: 18px 0; color: #cdd6f4; font-size: 13px; line-height: 1.6; }
  .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #2a3244; font-size: 11px; color: #64748b; }
  .footer a { color: #00d4ff; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>📬 NEW TRIAL SIGNUP</h1>

  <div class="row"><div class="label">Name</div><div class="value">{{ full_name }}</div></div>
  <div class="row"><div class="label">Email</div><div class="value">{{ signup_email }}</div></div>
  <div class="row"><div class="label">Country</div><div class="value">{{ country }}</div></div>
  <div class="row"><div class="label">Source</div><div class="value">{{ signup_source }}</div></div>
  <div class="row"><div class="label">IP</div><div class="value">{{ ip }}</div></div>
  <div class="row"><div class="label">Tenant ID</div><div class="value">{{ tenant_id }}</div></div>

  <p style="color:#64748b;letter-spacing:.08em;font-size:11px;text-transform:uppercase;margin-top:20px;margin-bottom:6px">Intended use</p>
  <div class="intent">{{ intended_use }}</div>

  <div class="footer">
    From: signup form on dialekt.ai · <a href="https://api.dias.now/admin/ui/">Open admin →</a>
  </div>
</div>
</body>
</html>
