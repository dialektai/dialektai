<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Добро пожаловать в dialekt.ai</title>
<style>
  body { font-family: 'Courier New', monospace; background: #0a0e14; color: #cdd6f4; margin: 0; padding: 40px 20px; }
  .card { max-width: 560px; margin: 0 auto; background: #13181f; border: 1px solid #2a3244; padding: 40px; }
  .logo { font-size: 20px; color: #89dceb; letter-spacing: 0.1em; margin-bottom: 32px; }
  h1 { font-size: 22px; color: #cdd6f4; margin: 0 0 16px; }
  p { color: #a6adc8; line-height: 1.7; margin: 0 0 20px; font-size: 14px; }
  .footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid #2a3244; font-size: 12px; color: #6c7086; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">dialekt.ai</div>
  <h1>Добро пожаловать, {{ company_name }}</h1>
  <p>Рады приветствовать вас в dialekt.ai. Ваш аккаунт создан и готов к настройке.</p>
  <p>Перейдите на <a href="{{ landing_url }}" style="color:#89dceb">{{ landing_url }}</a>, чтобы скачать приложение и начать работу.</p>
  <p>Если у вас появятся вопросы, напишите на <a href="mailto:hello@dialekt.ai" style="color:#89dceb">hello@dialekt.ai</a>.</p>
  <div class="footer">dialekt.ai</div>
</div>
</body>
</html>
