[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialekt-cloud"
version = "0.1.0"
description = "dias.now cloud service — license management, invite flow, agent registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "click>=8.1",
    "dialekt-manifest-validator>=0.1.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",          # admin password + backup-code hashing
    "pyotp>=2.9",                 # admin TOTP
    "qrcode[pil]>=7.4",           # provisioning QR code (SVG render)
    "email-validator>=2.0",       # required by pydantic EmailStr
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosmtpd>=1.4",
    "pytest-mock>=3.14",
]
dev = ["ruff", "mypy"]

[project.scripts]
dialekt-admin = "dialekt_cloud.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dialekt_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
