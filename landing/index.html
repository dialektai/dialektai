const GH_LATEST_RELEASE = 'https://api.github.com/repos/dialektai/dialektai/releases/latest';

function detectPlatform() {
  const ua = (navigator.userAgent || '').toLowerCase();
  const platform = (navigator.platform || '').toLowerCase();
  if (ua.includes('linux') || platform.includes('linux')) {
    // Default Linux users to .deb (Ubuntu/Debian majority)
    // Fedora / Arch / SUSE users can click the AppImage row.
    if (ua.includes('fedora') || ua.includes('arch') || ua.includes('suse')) return 'linux-appimage';
    return 'linux-deb';
  }
  if (ua.includes('mac') || platform.includes('mac')) return 'macos';
  if (ua.includes('win')) return 'windows';
  return 'linux-deb';  // fall back to the only platform we ship today
}

function fmtBytes(n) {
  if (!n || isNaN(n)) return null;
  const mb = n / (1024 * 1024);
  return `${mb.toFixed(0)} MB`;
}

function useReleases() {
  const [state, setState] = React.useState({
    version: null,
    publishedAt: null,
    debUrl: null, debSize: null,
    appimageUrl: null, appimageSize: null,
    dmgUrl: null, dmgSize: null,
    exeUrl: null, exeSize: null,
    msiUrl: null, msiSize: null,
    loading: true,
    error: null,
  });
  React.useEffect(() => {
    fetch(GH_LATEST_RELEASE, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(r => {
        if (!r.ok) throw new Error(`GitHub API: HTTP ${r.status}`);
        return r.json();
      })
      .then(release => {
        const assets = release.assets || [];
        const deb = assets.find(a => /\.deb$/i.test(a.name));
        const app = assets.find(a => /\.AppImage$/i.test(a.name));
        const dmg = assets.find(a => /\.dmg$/i.test(a.name));
        // Prefer NSIS *-setup.exe installer over generic .exe; MSI as fallback
        const exe = assets.find(a => /-setup\.exe$/i.test(a.name))
                 || assets.find(a => /\.exe$/i.test(a.name));
        const msi = assets.find(a => /\.msi$/i.test(a.name));
        setState({
          version: (release.tag_name || '').replace(/^v/, '') || '0.10.0',
          publishedAt: release.published_at ? release.published_at.substring(0, 10) : null,
          debUrl: deb ? deb.browser_download_url : null,
          debSize: deb ? fmtBytes(deb.size) : null,
          appimageUrl: app ? app.browser_download_url : null,
          appimageSize: app ? fmtBytes(app.size) : null,
          dmgUrl: dmg ? dmg.browser_download_url : null,
          dmgSize: dmg ? fmtBytes(dmg.size) : null,
          exeUrl: exe ? exe.browser_download_url : null,
          exeSize: exe ? fmtBytes(exe.size) : null,
          msiUrl: msi ? msi.browser_download_url : null,
          msiSize: msi ? fmtBytes(msi.size) : null,
          loading: false,
          error: null,
        });
      })
      .catch(err => {
        setState(s => ({ ...s, loading: false, error: err.message }));
      });
  }, []);
  return state;
}
